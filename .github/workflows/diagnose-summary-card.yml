name: Diagnose Contribution Visibility

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Query contribution visibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mapfile -t years < <(
            gh api graphql \
              -f query='
                query($login: String!) {
                  user(login: $login) {
                    contributionsCollection {
                      contributionYears
                    }
                  }
                }
              ' \
              -f login="${USERNAME}" \
              --jq '.data.user.contributionsCollection.contributionYears[]'
          )

          grand_commits=0
          grand_issues=0
          grand_prs=0
          grand_reviews=0
          grand_repos=0
          grand_restricted=0
          grand_calendar=0

          for year in "${years[@]}"; do
            from="${year}-01-01T00:00:00Z"
            to="${year}-12-31T23:59:59Z"

            result="$(
              gh api graphql \
                -f query='
                  query(
                    $login: String!,
                    $from: DateTime!,
                    $to: DateTime!
                  ) {
                    user(login: $login) {
                      contributionsCollection(
                        from: $from,
                        to: $to
                      ) {
                        totalCommitContributions
                        totalIssueContributions
                        totalPullRequestContributions
                        totalPullRequestReviewContributions
                        totalRepositoryContributions
                        restrictedContributionsCount
                        hasAnyRestrictedContributions
                        contributionCalendar {
                          totalContributions
                        }
                      }
                    }
                  }
                ' \
                -f login="${USERNAME}" \
                -f from="${from}" \
                -f to="${to}"
            )"

            commits="$(jq -r \
              '.data.user.contributionsCollection.totalCommitContributions' \
              <<< "${result}")"

            issues="$(jq -r \
              '.data.user.contributionsCollection.totalIssueContributions' \
              <<< "${result}")"

            prs="$(jq -r \
              '.data.user.contributionsCollection.totalPullRequestContributions' \
              <<< "${result}")"

            reviews="$(jq -r \
              '.data.user.contributionsCollection.totalPullRequestReviewContributions' \
              <<< "${result}")"

            repos="$(jq -r \
              '.data.user.contributionsCollection.totalRepositoryContributions' \
              <<< "${result}")"

            restricted="$(jq -r \
              '.data.user.contributionsCollection.restrictedContributionsCount' \
              <<< "${result}")"

            calendar="$(jq -r \
              '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
              <<< "${result}")"

            visible_known=$((commits + issues + prs + reviews + repos))
            other=$((calendar - visible_known - restricted))

            echo
            echo "${year}"
            echo "  Commits:              ${commits}"
            echo "  Issues:               ${issues}"
            echo "  Pull requests:        ${prs}"
            echo "  PR reviews:           ${reviews}"
            echo "  Repositories created: ${repos}"
            echo "  Restricted/private:   ${restricted}"
            echo "  Other/unclassified:   ${other}"
            echo "  Calendar total:       ${calendar}"

            grand_commits=$((grand_commits + commits))
            grand_issues=$((grand_issues + issues))
            grand_prs=$((grand_prs + prs))
            grand_reviews=$((grand_reviews + reviews))
            grand_repos=$((grand_repos + repos))
            grand_restricted=$((grand_restricted + restricted))
            grand_calendar=$((grand_calendar + calendar))
          done

          echo
          echo "=========================================="
          echo "TOTAL COMMITS:              ${grand_commits}"
          echo "TOTAL ISSUES:               ${grand_issues}"
          echo "TOTAL PULL REQUESTS:        ${grand_prs}"
          echo "TOTAL PR REVIEWS:           ${grand_reviews}"
          echo "TOTAL REPOSITORIES CREATED: ${grand_repos}"
          echo "TOTAL RESTRICTED/PRIVATE:   ${grand_restricted}"
          echo "TOTAL CALENDAR:             ${grand_calendar}"
          echo "=========================================="
