name: Trophy display

on:
  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 每周一自动更新
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=nord&column=4&row=2&margin-w=15&margin-h=15'
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Commit generated SVG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg

          if git diff --cached --quiet; then
            echo "trophy.svg has not changed."
            exit 0
          fi

          git commit -m "chore: update GitHub trophy"
          git push
