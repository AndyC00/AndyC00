name: Update GitHub Profile Trophies

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution from the Actions page
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-trophy
  cancel-in-progress: true

jobs:
  update-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate selected trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: >-
            username=${{ github.repository_owner }}&theme=nord&title=MultiLanguage,Stars,Commits,Followers,PullRequest,Repositories&row=2&column=3
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Commit and push trophy if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg

          if git diff --cached --quiet; then
            echo "No trophy changes detected."
            exit 0
          fi

          git commit -m "Update GitHub profile trophies"
          git push
