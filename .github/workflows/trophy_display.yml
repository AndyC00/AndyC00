name: Trophy display

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        run: |
          mkdir -p assets
          curl -fsSL "https://github-profile-trophy.vercel.app/?username=AndyC00&theme=nord&title=Reviews,Stars,Commits,Followers,PullRequest,Repositories&column=3" -o assets/trophy.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git diff --cached --quiet || git commit -m "Update trophy.svg"
          git push
