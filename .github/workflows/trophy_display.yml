name: Update GitHub Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        shell: bash
        run: |
          mkdir -p assets

          curl --fail --location \
            "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=nord&column=3&margin-w=15&margin-h=15" \
            --output assets/trophy.svg

      - name: Commit generated SVG
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/trophy.svg)" ]; then
            echo "trophy.svg has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg
          git commit -m "chore: update GitHub trophy"
          git push
