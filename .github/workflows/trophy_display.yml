name: Trophies display

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution from the Actions page
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-trophy
  cancel-in-progress: true

jobs:
  update-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate selected trophies
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=nord&title=MultiLanguage,Stars,Commits,Followers,PullRequest,Repositories&row=2&column=3"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "$URL" \
            -o assets/trophy.new.svg

          grep -q "<svg" assets/trophy.new.svg

          for trophy in \
            MultiLanguage \
            Stars \
            Commits \
            Followers \
            PullRequest \
            Repositories
          do
            if ! grep -q "$trophy" assets/trophy.new.svg; then
              echo "ERROR: Missing trophy: $trophy"
              rm -f assets/trophy.new.svg
              exit 1
            fi
          done

          mv assets/trophy.new.svg assets/trophy.svg

      - name: Commit and push trophy if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg

          if git diff --cached --quiet; then
            echo "No trophy changes detected."
            exit 0
          fi

          git commit -m "Update GitHub profile trophies"
          git push
