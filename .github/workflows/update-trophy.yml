name: Update GitHub Trophy

on:
  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 每周一自动更新一次
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/trophy.svg
          theme: nord
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVG
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/trophy.svg)" ]; then
            echo "trophy.svg has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/trophy.svg
          git commit -m "chore: update GitHub trophy"
          git push
